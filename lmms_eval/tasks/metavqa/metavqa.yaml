dataset_path: json
dataset_kwargs:  
  data_files: /home/unitree/桌面/datasets/metavqa/MetaVQA/test_fixed.json
task:  metavqa
test_split: train
output_type: generate_until  

doc_to_text: !function utils.metavqa_doc_to_text  
doc_to_messages: !function utils.metavqa_doc_to_messages  # v0.4 推荐接口  
doc_to_target: !function utils.metavqa_doc_to_target  
generation_kwargs:  
  temperature: 0  
  do_sample: false  
process_results: !function utils.metavqa_process_results  
metric_list:  
  - metric: acc  
    aggregation: !function utils.metavqa_aggregate_accuracy  
    higher_is_better: true  
lmms_eval_specific_kwargs:  
  default:  
    pre_prompt: ""  
    post_prompt: "Answer with the option's letter from the given choices directly."  
metadata:  
  - version: 0.0